name: Batuka Bhairava Intelligence Engine

on:
  workflow_dispatch:

  schedule:
    # Mandatory Pre-Market (8:45 AM IST)
    - cron: '15 3 * * *'

    # Mandatory Post-Market Wrap (3:40 PM IST)
    - cron: '10 10 * * *'

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Batuka Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m batuka_bhairav.run_engine
